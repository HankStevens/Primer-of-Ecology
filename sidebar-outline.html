<script>
(function () {
  function initSidebarChapterOutline() {
    var main = document.querySelector("main#quarto-document-content");
    var sidebar = document.querySelector("#quarto-sidebar");
    if (!main || !sidebar) return;

    var activeLink = sidebar.querySelector("a.sidebar-link.active");
    if (!activeLink) return;

    var activeItem = activeLink.closest("li.sidebar-item");
    if (!activeItem || activeItem.querySelector(".sidebar-chapter-outline")) return;

    // H2-level sections only, wherever they sit in the content
    // (top-level for chapters, or nested one level for index.qmd's
    // unnumbered "Preface" wrapper).
    var sections = main.querySelectorAll("section.level2[id]");
    if (!sections.length) return;

    var outline = document.createElement("ul");
    outline.className = "sidebar-chapter-outline list-unstyled";

    var entries = [];
    sections.forEach(function (sec) {
      var h2 = sec.querySelector("h2");
      if (!h2) return;
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "#" + sec.id;
      a.textContent = h2.textContent.trim().replace(/\s+/g, " ");
      li.appendChild(a);
      outline.appendChild(li);
      entries.push({ target: sec, link: a });
    });

    if (!entries.length) return;
    activeItem.appendChild(outline);

    // Highlight whichever section is currently in view, mirroring
    // Quarto's own "on this page" scrollspy but pointed at this list.
    var headerOffset = 90;
    function updateActive() {
      var current = null;
      for (var i = 0; i < entries.length; i++) {
        var top = entries[i].target.getBoundingClientRect().top;
        if (top - headerOffset <= 0) {
          current = entries[i];
        } else {
          break;
        }
      }
      entries.forEach(function (entry) {
        entry.link.classList.toggle("outline-active", entry === current);
      });
    }

    var ticking = false;
    window.addEventListener(
      "scroll",
      function () {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(function () {
          updateActive();
          ticking = false;
        });
      },
      { passive: true }
    );

    updateActive();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initSidebarChapterOutline);
  } else {
    initSidebarChapterOutline();
  }
})();
</script>
