project:
  type: book
  pre-render: scripts/build_refs.R

execute:
  freeze: auto   # only re-run a chapter's R code when that chapter's .qmd changes

book:
  title: "Primer of Ecology"
  author: "Hank Stevens"
  chapters:
    - index.qmd
    - 01-theory.qmd
    - 02-optimal_foraging.qmd
    - 03-Expo-growth.qmd
    - 04-DIDemography.qmd
    - 05-DDgrowth.qmd
    - 06-space.qmd
    - 07-direct_comp_mut.qmd
    - 07b-compcolstorage.qmd
    - 08-consumerResource.qmd
    - 09-host_parasitoid.qmd
    - 10-disease.qmd
    - 11-consumer-resource-comp-mut.qmd
    - 13-simplefoodwebs.qmd
    - 14-diversity.qmd
    - references.qmd

format:
  html:
    tufte: true
    link-citations: true    # correct boolean syntax
    toc: false    # hides the auto-generated "on this page" chapter-contents
                  # panel that Quarto book HTML shows in the right margin
    grid:
      margin-width: 350px
    code-overflow: wrap
  pdf:
    fontsize: 10pt
    mainfont: "Times New Roman"
    sansfont: "Times New Roman"
    grid:
      margin-width: 350px
    code-overflow: wrap
    include-in-header:
      - text: |
          \usepackage{fvextra}
          \DefineVerbatimEnvironment{Highlighting}{Verbatim}{
            breaklines,
            breakanywhere=true,
            commandchars=\\\{\}
          }

# Margin placement for BOTH html and pdf. Deliberately NOT combined with
# documentclass: tufte-book: that class defines its own \marginnote and
# collides with the `sidenotes` package Quarto loads to implement
# column: margin / these -location settings for PDF ("Command
# \marginnote already defined"). Quarto's own tests use the plain
# default PDF class with exactly this setup for that reason -- see
# quarto-dev/quarto-cli tests/docs/page-layout/tufte-pdf.qmd.
reference-location: margin
# citation-location: margin  -- disabled: crashes the current Quarto 1.10.x
# pre-release ("attempt to call a nil value (global
# 'marginCitePlaceholderInlineWithProtection')") in main.lua. Looks like an
# upstream bug in that build's margin-citation filter, not a content issue.
# Re-enable once a newer Quarto build fixes it. Citations fall back to
# normal (non-margin) placement in the meantime.
figure-location: margin

warning: false

bibliography:
  - book-refs.bib    # auto-generated subset of tidy.bib; see scripts/build_refs.R
  - packages.bib
